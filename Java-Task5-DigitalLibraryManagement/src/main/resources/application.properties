spring.application.name=digital-library
server.port=8080

# ---------- SQLite (file is created automatically) ----------
spring.datasource.url=jdbc:sqlite:./data/library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Library rules ----------
library.loan-days=14
library.fine-per-day=5
library.max-active-loans=3

spring.thymeleaf.cache=false
