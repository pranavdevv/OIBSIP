<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Books Management')}"></head>
<body>
<header th:replace="~{fragments :: nav('abooks')}"></header>
<div th:replace="~{fragments :: flash}"></div>

<main class="container">
  <div class="page-head">
    <div>
      <h1>Books Management 📚</h1>
      <p>Manage catalogue, add new books, or update quantities.</p>
    </div>
    <a th:href="@{/admin/books/new}" class="btn btn-primary">+ Add Book</a>
  </div>

  <form th:action="@{/admin/books}" method="get" class="glass card" style="display:flex; gap:1rem; align-items:flex-end; padding:1.5rem; margin-bottom: 2rem;">
    <div class="form-group" style="flex:2">
      <label for="q">Search by Title or Author</label>
      <input type="text" id="q" name="q" th:value="${q}" placeholder="e.g. Clean Code" class="form-control">
    </div>
    <div class="form-group" style="flex:1">
      <label for="category">Category</label>
      <select id="category" name="category" class="form-control">
        <option value="">All Categories</option>
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
      </select>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary">Search</button>
      <a th:if="${q != null or category != null}" th:href="@{/admin/books}" class="btn btn-ghost">Clear</a>
    </div>
  </form>

  <div th:if="${books.isEmpty()}" class="empty glass card">
    <div class="big">📭</div>
    <p>No books found.</p>
  </div>

  <div class="grid grid-3" th:unless="${books.isEmpty()}">
    <div class="glass card" th:each="b : ${books}" style="display:flex; flex-direction:column; gap:1rem; justify-content:space-between">
      <div style="display:flex; gap:1rem">
        <div th:replace="~{fragments :: cover(${b}, '')}"></div>
        <div>
          <h3 th:text="${b.title}" style="margin:0; font-size:1.1rem"></h3>
          <div class="faint" th:text="${b.author}"></div>
          <span class="pill pill-muted" style="margin-top:0.5rem; display:inline-block" th:text="${b.category}"></span>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
        <div>
          <strong><span th:text="${b.available}"></span> / <span th:text="${b.quantity}"></span></strong>
          <div class="faint">Available</div>
        </div>
        <div style="display:flex; gap:0.5rem">
          <a th:href="@{/admin/books/{id}/edit(id=${b.id})}" class="btn btn-sm btn-ghost">Edit</a>
          <form th:action="@{/admin/books/{id}/delete(id=${b.id})}" method="post" class="inline" th:attr="data-confirm='Delete ' + ${b.title} + '?'">
             <button type="submit" class="btn btn-sm btn-ghost" style="color:var(--danger)">Del</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
